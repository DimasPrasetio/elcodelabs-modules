name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Architecture rules, plus version bumps and forward-only migrations against the base.
      - run: node scripts/catalog.mjs --check --since "${{ github.event.pull_request.base.sha || github.event.before }}"

  testbed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TESTBED_DB_DSN: "root:@tcp(127.0.0.1:3306)/"
    steps:
      - uses: actions/checkout@v4
      # The scaffolder the modules install into. Set the repository variable SKILL_REPO to the
      # GitHub repo holding monorepo-elcodelabs (owner/name) and SKILL_PATH to its folder in it.
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SKILL_REPO }}
          path: .skill
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: mysql client
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - run: node scripts/testbed.mjs --skill ".skill/${{ vars.SKILL_PATH }}"
